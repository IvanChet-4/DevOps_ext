stages:
  - test
  - build


test_job:
  stage: test
  image: golang:1.21-alpine
  script:
    - echo "Running go tests..."
    - go test -v ./... || true
  rules:
    - changes:
        - "**/*.go"


build_job:
  stage: build
  image: golang:1.21-alpine
  needs: []
  script:
    - echo "Compiling the Go application..."
    - mkdir -p build
    - go build -o build/app main.go || echo "No main.go found, but build stage triggered!"
  artifacts:
    paths:
      - build/
