input {
  udp {
    port => 5044
    codec => "json"
  }
}

filter {
  # Если логи придут уже структурированными или как текст
  if [message] {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nginx-logstash-%{+YYYY.MM.dd}"
  }
}
