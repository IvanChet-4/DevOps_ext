version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_local
    ports:
      # Порт для подключения приложений (клиентов)
      - "5672:5672"
      # Порт для веб-интерфейса
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
