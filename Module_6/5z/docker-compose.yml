version: '3.8'

services:
  grafana:
    image: grafana/grafana:latest
    container_name: chet-i-s-netology-grafana
    ports:
      - "80:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning
      - grafana_custom:/etc/grafana/custom
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SERVER_HTTP_PORT=3000
      - GF_CUSTOM_INI_PATH=/etc/grafana/custom/custom.ini
    restart: unless-stopped

volumes:
  grafana_data:
  grafana_custom:
