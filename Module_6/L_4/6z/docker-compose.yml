version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: chet-i-s-netology-postgres
    ports:
      - "5432"
    environment:
      POSTGRES_USER: netology
      POSTGRES_PASSWORD: netology
      POSTGRES_DB: netology
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      chet-i-s-my-netology-hw:
        ipv4_address: 10.5.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netology"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: chet-i-s-netology-grafana
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "88:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - grafana_provisioning:/etc/grafana/provisioning
      - ./grafana/custom.ini:/etc/grafana/grafana.ini:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SERVER_HTTP_PORT=3000
      - GF_CUSTOM_INI_PATH=/etc/grafana/grafana.ini
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres:5432
      - GF_DATABASE_NAME=netology
      - GF_DATABASE_USER=netology
      - GF_DATABASE_PASSWORD=netology
    networks:
      chet-i-s-my-netology-hw:
        ipv4_address: 10.5.0.20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: chet-i-s-netology-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      chet-i-s-my-netology-hw:
        ipv4_address: 10.5.0.30
    restart: unless-stopped

volumes:
  grafana_data:
  grafana_provisioning:
  postgres_data:
  prometheus_data:

networks:
  chet-i-s-my-netology-hw:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
