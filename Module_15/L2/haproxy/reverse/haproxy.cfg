global
    log /dev/log local0

defaults
    log     global
    mode    http
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend http_front
    bind *:8080
    default_backend web_back

backend web_back
    # Перенаправляем на статический IP python-приложения
    server web_node 172.20.0.5:5000 check
